name: Player Scrape Regression Tests

on:
  push:
    paths:
      - 'player-scrape/contracts/scripts/**'
      - 'player-scrape/contracts/snapshots/**'
      - 'player-scrape/contracts/fixtures/**'
  pull_request:
    paths:
      - 'player-scrape/contracts/scripts/**'
      - 'player-scrape/contracts/snapshots/**'
      - 'player-scrape/contracts/fixtures/**'
  workflow_dispatch:

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci
      
      - name: Run type checking
        run: npm run typecheck
        continue-on-error: true
      
      - name: Run public contract and cloud safety cases
        run: npm run test:cloud-dev

      - name: Check retained regression input availability
        id: fixtures
        shell: bash
        run: |
          node --import tsx --input-type=module <<'JS'
          import { existsSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          import { REGRESSION_FIXTURES, paths } from './player-scrape/contracts/scripts/config.ts';
          const available = REGRESSION_FIXTURES.every((id) =>
            existsSync(path.join(paths.snapshotsDir, id + '.html')) &&
            existsSync(path.join(paths.fixturesDir, id + '.snapshot.json')));
          appendFileSync(process.env.GITHUB_OUTPUT, 'available=' + available + '\n');
          if (!available) console.log('::notice::Legacy contract source regressions unavailable: retained private HTML/expected inputs are absent. They were not run or accepted as passing. Do not upload private source inputs to public CI.');
          JS

      - name: Run regression tests
        if: steps.fixtures.outputs.available == 'true'
        run: npm run regress
