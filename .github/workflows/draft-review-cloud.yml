name: Bounded draft review Firebase operation

# Agent-owned request commits support pre-merge operation. App commits alone
# cannot deploy or request a production approval.
on:
  push:
    branches: ['feature/bze-321-hosted-draft-review']
    paths: ['.github/draft-review-request.json']

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.request.outputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          operation=$(jq -er 'select(keys == ["operation"]) | .operation | select(. == "inspect" or . == "publish")' .github/draft-review-request.json)
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"
  operation:
    needs: request
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: Bet-Zero/scoutzero/.github/workflows/draft-review-worker.yml@0fb1b922164519002175a32b933d240db6ba5b03
    with:
      operation: ${{ needs.request.outputs.operation }}
