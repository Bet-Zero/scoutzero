name: Bounded draft review Firebase operation

# Agent-owned request commits support pre-merge operation. App commits alone
# cannot deploy or request a production approval.
on:
  push:
    branches: ['feature/bze-321-hosted-draft-review']
    paths: ['.github/draft-review-request.json']

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.request.outputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          operation=$(jq -er 'select(keys == ["operation"]) | .operation | select(. == "inspect" or . == "publish")' .github/draft-review-request.json)
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"
  operation:
    needs: request
    if: needs.request.outputs.operation == 'inspect'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: Bet-Zero/scoutzero/.github/workflows/draft-review-worker.yml@2b9391ca0327630785a8b1d34c02506585680cf5
    with:
      operation: inspect
  publication:
    needs: request
    if: needs.request.outputs.operation == 'publish'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: Bet-Zero/scoutzero/.github/workflows/draft-review-publication.yml@7f2b815ce9a5deb3d7b99546dd9ee3c699a66cb2
    # Environment-only secrets still require an explicit caller handoff. Do not
    # inherit repository secrets here (including the unrelated reviewer token).
    secrets:
      BZE321_INSTALLATION_PASSPHRASE: ${{ secrets.BZE321_INSTALLATION_PASSPHRASE }}
