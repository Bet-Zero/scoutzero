name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main
  schedule:
    # Run full test suite nightly at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  draft-worker-permission-probe:
    name: Draft worker GitHub read-permission proof
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/bze-321-hosted-draft-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Same GITHUB_TOKEN permissions and REST endpoint families as the frozen
      # worker, using an existing environment. No Google identity or writes.
      - name: Prove environment protection reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Bet-Zero/scoutzero/environments/Production --jq '{name,protectionRuleCount:(.protection_rules|length)}'

  # PR validation - uses diff-based testing for speed
  pr-validation:
    name: PR Validation (Diff-based)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    env:
      SCOUTZERO_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      SCOUTZERO_DIFF_HEAD: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Complete candidate range, including every commit and both rename paths
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Validate selection policy
        run: npm run test:node -- tests/runTestsByDiff.test.ts --reporter=dot

      - name: Select candidate validation
        id: scope
        run: node scripts/run-tests-by-diff.mjs --ci-plan --verbose

      - name: Documentation and routing checks
        if: steps.scope.outputs.docs == 'true'
        run: node scripts/run-tests-by-diff.mjs --docs

      - name: Policy implementation checks
        if: steps.scope.outputs.policy == 'true' && steps.scope.outputs.app != 'true'
        run: npm run test:diff -- --reporter=dot

      - name: Verify isolated spacing diff
        if: steps.scope.outputs.level == 'cosmetic' && steps.scope.outputs.docs != 'true'
        run: npm run test:diff -- --reporter=dot

      - name: Type check
        if: steps.scope.outputs.app == 'true'
        run: npm run typecheck

      - name: Architect cast-ledger gate
        if: steps.scope.outputs.architect == 'true'
        run: npm run lint:architect-gate

      - name: Draft data architecture boundary
        if: steps.scope.outputs.draft == 'true'
        run: npm run test:node -- tests/architect/draftReviewArchitecture.guardrail.test.ts tests/architect/draftReviewCloudConnection.test.ts tests/architect/draftReviewDeployment.test.ts tests/architect/draftSourceInventory.test.ts --reporter=dot

      - name: Fetch accepted Canon authority ref
        if: steps.scope.outputs.authority == 'true'
        run: git fetch --no-tags origin architect/cba-canon-v2:refs/remotes/origin/architect/cba-canon-v2

      - name: Phase 3A workflow tooling
        if: steps.scope.outputs.authority == 'true'
        run: npm run test:phase3a-workflow

      - name: Private source review transport boundary
        if: steps.scope.outputs.transport == 'true'
        run: npm run test:private-source-review

      - name: Install matching browser for the redirect proof
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 3
        run: npx --no-install playwright install --with-deps chromium

      - name: Hosted review browser redirect boundary
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 2
        run: npm run test:hosted-review-browser
      - name: Cloud development safety tests
        if: steps.scope.outputs.cloud == 'true'
        run: npm run test:cloud-dev

      - name: Cloud tooling type check
        if: steps.scope.outputs.cloud == 'true'
        run: npm run cloud:typecheck

      - name: Governed Offer Sheet creation emulator gate
        if: steps.scope.outputs.emulator == 'true'
        run: npm run ci:offer-sheet-creation-emulator-gate

      - name: Run diff-based tests
        if: steps.scope.outputs.app == 'true'
        run: npm run test:diff -- --verbose --reporter=dot

      - name: Validate project schema
        if: steps.scope.outputs.app == 'true'
        run: npm run validate:project

      - name: Build
        if: steps.scope.outputs.app == 'true'
        run: npm run build

  # Full integration health remains nightly; pushes use the same bounded policy as PRs
  full-validation:
    name: Full Build, Test & Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Type check
        run: npm run typecheck

      - name: Architect cast-ledger gate
        run: npm run lint:architect-gate

      - name: Draft data architecture boundary
        run: npm run test:node -- tests/architect/draftReviewArchitecture.guardrail.test.ts tests/architect/draftReviewCloudConnection.test.ts tests/architect/draftReviewDeployment.test.ts --reporter=dot

      - name: Fetch accepted Canon authority ref
        run: git fetch --no-tags origin architect/cba-canon-v2:refs/remotes/origin/architect/cba-canon-v2

      - name: Phase 3A workflow tooling
        run: npm run test:phase3a-workflow

      - name: Private source review transport boundary
        run: npm run test:private-source-review

      - name: Install matching browser for the redirect proof
        timeout-minutes: 3
        run: npx --no-install playwright install --with-deps chromium

      - name: Hosted review browser redirect boundary
        timeout-minutes: 2
        run: npm run test:hosted-review-browser
      - name: Cloud development safety tests
        run: npm run test:cloud-dev

      - name: Cloud tooling type check
        run: npm run cloud:typecheck

      - name: Governed Offer Sheet creation emulator gate
        run: npm run ci:offer-sheet-creation-emulator-gate

      - name: Run full test suite
        run: npm run test:full

      - name: Validate project schema
        run: npm run validate:project

      - name: Build
        run: npm run build
