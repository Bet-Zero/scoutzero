name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main
  schedule:
    # Run full test suite nightly at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  draft-worker-permission-probe:
    name: Draft worker GitHub read-permission proof
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/bze-321-hosted-draft-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Same GITHUB_TOKEN permissions and REST endpoint families as the frozen
      # worker, using an existing environment. No Google identity or writes.
      - name: Prove environment protection reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Bet-Zero/scoutzero/environments/Production --jq '{name,protectionRuleCount:(.protection_rules|length)}'

  # PR validation - uses diff-based testing for speed
  pr-validation:
    name: PR Validation (Diff-based)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch more history for better diff detection
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Type check
        run: npm run typecheck

      - name: Architect cast-ledger gate
        run: npm run lint:architect-gate

      - name: Draft data architecture boundary
        run: npm run test:node -- tests/architect/draftReviewArchitecture.guardrail.test.ts tests/architect/draftReviewCloudConnection.test.ts tests/architect/draftReviewDeployment.test.ts --reporter=dot

      - name: Fetch accepted Canon authority ref
        run: git fetch --no-tags origin architect/cba-canon-v2:refs/remotes/origin/architect/cba-canon-v2

      - name: Phase 3A workflow tooling
        run: npm run test:phase3a-workflow

      - name: Install matching browser for the redirect proof
        timeout-minutes: 3
        run: npx --no-install playwright install --with-deps chromium

      - name: Hosted review browser redirect boundary
        timeout-minutes: 2
        run: npm run test:hosted-review-browser

      - name: Governed Offer Sheet creation emulator gate
        run: npm run ci:offer-sheet-creation-emulator-gate

      - name: Run diff-based tests
        run: npm run test:diff -- --verbose

      - name: Validate project schema
        run: npm run validate:project

      - name: Build
        run: npm run build

  # Full validation - for main branch and scheduled runs
  full-validation:
    name: Full Build, Test & Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Type check
        run: npm run typecheck

      - name: Architect cast-ledger gate
        run: npm run lint:architect-gate

      - name: Draft data architecture boundary
        run: npm run test:node -- tests/architect/draftReviewArchitecture.guardrail.test.ts tests/architect/draftReviewCloudConnection.test.ts tests/architect/draftReviewDeployment.test.ts --reporter=dot

      - name: Fetch accepted Canon authority ref
        run: git fetch --no-tags origin architect/cba-canon-v2:refs/remotes/origin/architect/cba-canon-v2

      - name: Phase 3A workflow tooling
        run: npm run test:phase3a-workflow

      - name: Install matching browser for the redirect proof
        timeout-minutes: 3
        run: npx --no-install playwright install --with-deps chromium

      - name: Hosted review browser redirect boundary
        timeout-minutes: 2
        run: npm run test:hosted-review-browser

      - name: Governed Offer Sheet creation emulator gate
        run: npm run ci:offer-sheet-creation-emulator-gate

      - name: Run full test suite
        run: npm run test:full

      - name: Validate project schema
        run: npm run validate:project

      - name: Build
        run: npm run build
