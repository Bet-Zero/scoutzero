name: Controlled ordinary NBA maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Access probe never writes. Publish requires exact registered approval.
        type: choice
        options: [access, publish]
        default: access
        required: true
      plan_sha256:
        description: Exact reviewed owner-approved plan digest; empty for access.
        type: string
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  controlled:
    # Immutable executor; Google trust pins this same called-workflow commit.
    uses: Bet-Zero/scoutzero/.github/workflows/nba-maintenance-worker.yml@df87a5598073f0f90a37d707bed4eac9fe6118fe
    with:
      operation: ${{ inputs.operation }}
      plan_sha256: ${{ inputs.plan_sha256 }}
