er":false},"gtmTag":"GTM-KN8Q93","googleSiteVerificationCode":"","adobeLaunchUrl":"","currentSeasonYear":"2026-27"},"article":{"relatedContent":{"theme":"dark","source":"recent","sourceId":null}},"gallery":{},"personalization":{}},"pageObject":{"id":47189,"type":"article","name":"raptors-trade-deadline-primer","title":"Raptors Trade Deadline Primer","status":"publish","slug":"raptors-trade-deadline-primer","permalink":"https://www.nba.com/raptors/raptors-trade-deadline-primer","excerpt":"The NBA trade deadline is at 3 p.m. ET on Thursday. With it comes the annual array of questions, trade hypotheticals, and exciting chatter that’s become the defining trait of basketball in early February. It’s a really fun time of year.","timestamp":1517951040000,"date":"2018-02-06T21:04:00Z","modified":"2021-10-26T15:58:34Z","featuredImage":{"src":"https://cdn.nba.com/teams/legacy/www.nba.com/raptors/sites/raptors/files/ujiri756.jpg","alt":"","link":"","caption":"","type":"image","align":"","size":{"width":512,"height":512},"html":null,"attributes":{"size":{"width":512,"height":512},"src":"https://cdn.nba.com/teams/legacy/www.nba.com/raptors/sites/raptors/files/ujiri756.jpg","alt":"","link":"","caption":"","id":"1002234","credit":"","align":"","caption_color":""},"text":null,"id":"1002234","credit":"","caption_color":""},"category":"articles,Uncategorized","taxonomy":{"categories":{"articles":"articles","uncategorized":"Uncategorized"},"tags":{"blake-murphy":"Blake Murphy","trade-deadline":"Trade Deadline"},"teams":{"1610612761":"Toronto Raptors"}},"seo":{"canonicalUrl":"","keywords":"","general":{"title":null,"description":null},"twitter":{"image":null,"description":null,"title":null},"facebook":{"image":null,"description":null,"title":null}},"attributes":{},"syndication":{"amp":{"enabled":false},"platforms":{"app":true,"web":true}},"contentStructured":[{"html":"\u003cp\u003eThe NBA trade deadline is at 3 p.m. ET on Thursday. With it comes the annual array of questions, trade hypotheticals, and exciting chatter that’s become the defining trait of basketball in early February. It’s a really fun time of year.\u003c/p\u003e","attributes":[],"text":"The NBA trade deadline is at 3 p.m. ET on Thursday. With it comes the annual array of questions, trade hypotheticals, and exciting chatter that’s become the defining trait of basketball in early February. It’s a really fun time of year.","type":"paragraph"},{"html":"\u003cp\u003eIt’s also a complicated one. The NBA’s salary cap rules govern what teams can and can’t do in trade. Coming up with trade scenarios that are legal can get a little complex, and while it’s not fans’ responsibility to know all of these rules, the answer to “why didn’t the Raptors do THIS” is often that it may have been illegal. Even the vaunted ESPN Trade Machine has some holes.\u003c/p\u003e","attributes":[],"text":"It’s also a complicated one. The NBA’s salary cap rules govern what teams can and can’t do in trade. Coming up with trade scenarios that are legal can get a little complex, and while it’s not fans’ responsibility to know all of these rules, the answer to “why didn’t the Raptors do THIS” is often that it may have been illegal. Even the vaunted ESPN Trade Machine has some holes.","type":"paragraph"},{"html":null,"attributes":{"type":"rich","url":"https://www.twitter.com/BlakeMurphyODC"},"text":null,"type":"twitter"},{"html":"\u003cp\u003eWho can the Raptors trade?\u003c/p\u003e","attributes":[],"text":"Who can the Raptors trade?","type":"paragraph"},{"html":"\u003cp\u003eThe NBA restricts teams from trading players for certain periods of time after they’ve been signed, re-signed, or signed to extensions. Most of those restrictions are gone at this point. The only player the Raptors can’t trade is Norman Powell. Powell signed a contract extension in October, and the rules prohibit a team from extending a player and then trading him for six months. Powell, then, can’t be dealt until after the Raptors are eliminated from the playoffs.\u003c/p\u003e","attributes":[],"text":"The NBA restricts teams from trading players for certain periods of time after they’ve been signed, re-signed, or signed to extensions. Most of those restrictions are gone at this point. The only player the Raptors can’t trade is Norman Powell. Powell signed a contract extension in October, and the rules prohibit a team from extending a player and then trading him for six months. Powell, then, can’t be dealt until after the Raptors are eliminated from the playoffs.","type":"paragraph"},{"html":"\u003cp\u003eEveryone else, including the team’s two-way players, is eligible to be traded.\u003c/p\u003e","attributes":[],"text":"Everyone else, including the team’s two-way players, is eligible to be traded.","type":"paragraph"},{"html":null,"attributes":{"size":{"width":512,"height":512},"src":"https://cdn.nba.com/teams/legacy/i.cdn.turner.com/nba/nba/.element/media/2.0/teamsites/raptors/images/blake-powell756.jpg","alt":"Norman Powell","link":"","caption":"","id":"1002232","credit":"","align":"","caption_color":""},"text":null,"type":"image"},{"html":"\u003cp\u003e \u003c/p\u003e","attributes":[],"text":" ","type":"paragraph"},{"html":"\u003cp\u003eWhat about draft picks?\u003c/p\u003e","attributes":[],"text":"What about draft picks?","type":"paragraph"},{"html":"\u003cp\u003eThe Raptors can also include draft picks in trades, though they’re limited in which ones they can send out. They can’t trade either of their picks for the 2018 draft because they don’t have any – the Raptors traded a first-round pick and a second-round pick to Brooklyn in the DeMarre Carroll trade this past summer.\u003c/p\u003e","attributes":[],"text":"The Raptors can also include draft picks in trades, though they’re limited in which ones they can send out. They can’t trade either of their picks for the 2018 draft because they don’t have any – the Raptors traded a first-round pick and a second-round pick to Brooklyn in the DeMarre Carroll trade this past summer.","type":"paragraph"},{"html":"\u003cp\u003eThe Raptors have all of their picks in both rounds from 2019 onward. Teams can trade picks up to seven years into the future, so they could theoretically trade a pick as far away as the 2024 draft.\u003c/p\u003e","attributes":[],"text":"The Raptors have all of their picks in both rounds from 2019 onward. Teams can trade picks up to seven years into the future, so they could theoretically trade a pick as far away as the 2024 draft.","type":"paragraph"},{"html":"\u003cp\u003eThey cannot, however, trade their 2019 first-round pick, even though they have it. Teams are not allowed to trade their future first-round pick in consecutive years, so since the Raptors have already traded their 2018 first-rounder, they can’t trade their 2019 first-rounder. (This restriction is removed following the 2018 draft, since the pick won’t be a “future” pick any longer.)\u003c/p\u003e","attributes":[],"text":"They cannot, however, trade their 2019 first-round pick, even though they have it. Teams are not allowed to trade their future first-round pick in consecutive years, so since the Raptors have already traded their 2018 first-rounder, they can’t trade their 2019 first-rounder. (This restriction is removed following the 2018 draft, since the pick won’t be a “future” pick any longer.)","type":"paragraph"},{"html":"\u003cp\u003eCan they trade anything else?\u003c/p\u003e","attributes":[],"text":"Can they trade anything else?","type":"paragraph"},{"html":"\u003cp\u003eTeams are permitted to include up to $5.1 million (US$) in cash in trades total during a season year. The Raptors have not sent any of that allotment out yet.\u003c/p\u003e","attributes":[],"text":"Teams are permitted to include up to $5.1 million (US$) in cash in trades total during a season year. The Raptors have not sent any of that allotment out yet.","type":"paragraph"},{"html":"\u003cp\u003eThe Raptors also hold the draft rights to DeeAndre Hulett (2000) and Emir Preldzic (2009). That might sound strange, but teams have to send something in every trade, and so these are valuable chips to have just in case a trade needs to be structured in a creative way.\u003c/p\u003e","attributes":[],"text":"The Raptors also hold the draft rights to DeeAndre Hulett (2000) and Emir Preldzic (2009). That might sound strange, but teams have to send something in every trade, and so these are valuable chips to have just in case a trade needs to be structured in a creative way.","type":"paragraph"},{"html":"\u003cp\u003eWhat are the salary cap rules for trades?\u003c/p\u003e","attributes":[],"text":"What are the salary cap rules for trades?","type":"paragraph"},{"html":"\u003cp\u003eWe’ll try to simplify here best we can. Because the Raptors are over the salary cap, incoming and outgoing salaries in any trade have to be fairly close. The rules are normally more complicated, but things are simplified a little for the Raptors since adding any salary threatens to put them into the luxury tax (if they’re not already in it).\u003c/p\u003e","attributes":[],"text":"We’ll try to simplify here best we can. Because the Raptors are over the salary cap, incoming and outgoing salaries in any trade have to be fairly close. The rules are normally more complicated, but things are simplified a little for the Raptors since adding any salary threatens to put them into the luxury tax (if they’re not already in it).","type":"paragraph"},{"html":"\u003cp\u003eFor the purposes of this deadline, the Raptors can only take back up to 25 percent more salary than they send out, plus $100,000. So if they sent out a player making $4 million, they could take back a player making $5.1 million (25-percent more, plus $100,000). The Raptors can take back as little salary in a trade as they like (the matching is only required for taking on more money).\u003c/p\u003e","attributes":[],"text":"For the purposes of this deadline, the Raptors can only take back up to 25 percent more salary than they send out, plus $100,000. So if they sent out a player making $4 million, they could take back a player making $5.1 million (25-percent more, plus $100,000). The Raptors can take back as little salary in a trade as they like (the matching is only required for taking on more money).","type":"paragraph"},{"html":"\u003cp\u003eSalaries can be combined in trades, so trading two players making $4 million would let the Raptors take back $10.1 million, for example. Draft picks, the draft rights to players, and cash all have no value for the purposes of matching salaries.\u003c/p\u003e","attributes":[],"text":"Salaries can be combined in trades, so trading two players making $4 million would let the Raptors take back $10.1 million, for example. Draft picks, the draft rights to players, and cash all have no value for the purposes of matching salaries.","type":"paragraph"},{"html":"\u003cp\u003eAre there any loopholes?\u003c/p\u003e","attributes":[],"text":"Are there any loopholes?","type":"paragraph"},{"html":"\u003cp\u003eAre there ever. The primary one is the existence of “traded player exceptions,” which are created by the differences in salaries in a trade. The Carroll trade from the summer, for example, saw the Raptors send out more salary than they took back, creating an $11.8-million exception in the process. The Cory Joseph trade created a $7.6-million exception, as well.\u003c/p\u003e","attributes":[],"text":"Are there ever. The primary one is the existence of “traded player exceptions,” which are created by the differences in salaries in a trade. The Carroll trade from the summer, for example, saw the Raptors send out more salary than they took back, creating an $11.8-million exception in the process. The Cory Joseph trade created a $7.6-million exception, as well.","type":"paragraph"},{"html":"\u003cp\u003eExceptions can’t be combined with each other or with players to take on more salary, so while the Raptors could absorb a player into one of those exceptions, they can’t add them up to bring back one very high-priced player.\u003c/p\u003e","attributes":[],"text":"Exceptions can’t be combined with each other or with players to take on more salary, so while the Raptors could absorb a player into one of those exceptions, they can’t add them up to bring back one very high-priced player.","type":"paragraph"},{"html":"\u003cp\u003eThe Raptors can get a little creative in how they structure trades to take advantage of these exceptions, or to create more of them. For example, trading a $3-million player for a $7-million player violates the rules above, but trading a $3-million player in one deal and then acquiring a $7-million player with an exception is theoretically possible. There are other iterations that get more and more complicated. All of this is to say that while salary matching is difficult, there are some tools at a team’s disposal to make something happen.\u003c/p\u003e","attributes":[],"text":"The Raptors can get a little creative in how they structure trades to take advantage of these exceptions, or to create more of them. For example, trading a $3-million player for a $7-million player violates the rules above, but trading a $3-million player in one deal and then acquiring a $7-million player with an exception is theoretically possible. There are other iterations that get more and more complicated. All of this is to say that while salary matching is difficult, there are some tools at a team’s disposal to make something happen.","type":"paragraph"},{"html":"\u003cp\u003eTeams can also involve an extra team to help facilitate trades, either by providing additional players and picks or taking on salary to help the numbers work. Those teams usually need to be compensated for helping out.\u003c/p\u003e","attributes":[],"text":"Teams can also involve an extra team to help facilitate trades, either by providing additional players and picks or taking on salary to help the numbers work. Those teams usually need to be compensated for helping out.","type":"paragraph"},{"html":"\u003cp\u003eFeels like there’s a but coming…\u003c/p\u003e","attributes":[],"text":"Feels like there’s a but coming…","type":"paragraph"},{"html":"\u003cp\u003eThe luxury tax line and the “luxury tax apron” both hang over the Raptors at the deadline. Exact contract figures for players aren’t confirmed by the team, but based on thr best publicly available estimates, the Raptors are very close to the luxury tax line. So if the Raptors add salary, it will come at a financial cost – for the first $5 million the Raptors go into the tax, they’d have to pay $1.50 in luxury tax payments, and $1.75 per-dollar for the next $5 million after that (and escalating from there). Teams that pay the tax also don’t receive tax payments from tax-paying teams at the end of the year.\u003c/p\u003e","attributes":[],"text":"The luxury tax line and the “luxury tax apron” both hang over the Raptors at the deadline. Exact contract figures for players aren’t confirmed by the team, but based on thr best publicly available estimates, the Raptors are very close to the luxury tax line. So if the Raptors add salary, it will come at a financial cost – for the first $5 million the Raptors go into the tax, they’d have to pay $1.50 in luxury tax payments, and $1.75 per-dollar for the next $5 million after that (and escalating from there). Teams that pay the tax also don’t receive tax payments from tax-paying teams at the end of the year.","type":"paragraph"},{"html":null,"attributes":{"size":{"width":512,"height":512},"src":"https://cdn.nba.com/teams/legacy/i.cdn.turner.com/nba/nba/.element/media/2.0/teamsites/raptors/images/blake-miles756.jpg","alt":"CJ Miles","link":"","caption":"","id":"1002233","credit":"","align":"","caption_color":""},"text":null,"type":"image"},{"html":"\u003cp\u003e \u003c/p\u003e","attributes":[],"text":" ","type":"paragraph"},{"html":"\u003cp\u003eThe Raptors are also capped by what’s known as the luxury tax apron. In basic terms, the Raptors are “hard-capped” at $125.3 million for the year. That was triggered because the Raptors used the “non-taxpayer mid-level exception” to sign C.J. Miles this summer. Under no circumstances can they cross that salary total, even in the event of injury.\u003c/p\u003e","attributes":[],"text":"The Raptors are also capped by what’s known as the luxury tax apron. In basic terms, the Raptors are “hard-capped” at $125.3 million for the year. That was triggered because the Raptors used the “non-taxpayer mid-level exception” to sign C.J. Miles this summer. Under no circumstances can they cross that salary total, even in the event of injury.","type":"paragraph"},{"html":"\u003cp\u003eWhat this means is that even with the exceptions available to them or within the salary matching rules and loopholes, the Raptors can’t go over that mark. Based on the best publicly available estimates, then, the Raptors can only add about $4.6 million in salary ahead of the deadline.\u003c/p\u003e","attributes":[],"text":"What this means is that even with the exceptions available to them or within the salary matching rules and loopholes, the Raptors can’t go over that mark. Based on the best publicly available estimates, then, the Raptors can only add about $4.6 million in salary ahead of the deadline.","type":"paragraph"},{"html":"\u003cp\u003eAnything else to consider?\u003c/p\u003e","attributes":[],"text":"Anything else to consider?","type":"paragraph"},{"html":"\u003cp\u003eThe Raptors have to have 14 players on the roster at all times, excluding two-way players. That means that if the Raptors send out two players for one, they’d have to sign someone to fill that 14th roster spot. The salary for that player will needed to be accounted for under the luxury tax apron, so simply piling up players to add more salary in a trade isn’t feasible.\u003c/p\u003e","attributes":[],"text":"The Raptors have to have 14 players on the roster at all times, excluding two-way players. That means that if the Raptors send out two players for one, they’d have to sign someone to fill that 14th roster spot. The salary for that player will needed to be accounted for under the luxury tax apron, so simply piling up players to add more salary in a trade isn’t feasible.","type":"paragraph"},{"html":"\u003cp\u003eHow else can the Raptors improve their roster?\u003c/p\u003e","attributes":[],"text":"How else can the Raptors improve their roster?","type":"paragraph"},{"html":"\u003cp\u003eThe trade deadline is only that: The deadline for trades. The Raptors can still add players after Thursday if they see fit. They have a 15th roster spot open, and as long as a player is waived by his former team by March 1, he’ll be playoff eligible. They can offer free agents the minimum salary or the remaining prorated amount of their bi-annual exception (which was originally $3.3 million). The Raptors still have to abide by the luxury tax apron and may have to pay tax on whatever salary they pay that player.\u003c/p\u003e","attributes":[],"text":"The trade deadline is only that: The deadline for trades. The Raptors can still add players after Thursday if they see fit. They have a 15th roster spot open, and as long as a player is waived by his former team by March 1, he’ll be playoff eligible. They can offer free agents the minimum salary or the remaining prorated amount of their bi-annual exception (which was originally $3.3 million). The Raptors still have to abide by the luxury tax apron and may have to pay tax on whatever salary they pay that player.","type":"paragraph"}],"flexModules":[],"contentExpanded":[{"attributes":[],"type":"paragraph","html":"\u003cp\u003eThe NBA trade deadline is at 3 p.m. ET on Thursday. With it comes the annual array of questions, trade hypotheticals, and exciting chatter that’s become the defining trait of basketball in early February. It’s a really fun time of year.\u003c/p\u003e","text":"The NBA trade deadline is at 3 p.m. ET on  salary in a trade as they like (the matching is only required for taking on more money)."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eSalaries can be combined in trades, so trading two players making $4 million would let the Raptors take back $10.1 million, for example. Draft picks, the draft rights to players, and cash all have no value for the purposes of matching salaries.\u003c/p\u003e","text":"Salaries can be combined in trades, so trading two players making $4 million would let the Raptors take back $10.1 million, for example. Draft picks, the draft rights to players, and cash all have no value for the purposes of matching salaries."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eAre there any loopholes?\u003c/p\u003e","text":"Are there any loopholes?"},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eAre there ever. The primary one is the existence of “traded player exceptions,” which are created by the differences in salaries in a trade. The Carroll trade from the summer, for example, saw the Raptors send out more salary than they took back, creating an $11.8-million exception in the process. The Cory Joseph trade created a $7.6-million exception, as well.\u003c/p\u003e","text":"Are there ever. The primary one is the existence of “traded player exceptions,” which are created by the differences in salaries in a trade. The Carroll trade from the summer, for example, saw the Raptors send out more salary than they took back, creating an $11.8-million exception in the process. The Cory Joseph trade created a $7.6-million exception, as well."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eExceptions can’t be combined with each other or with players to take on more salary, so while the Raptors could absorb a player into one of those exceptions, they can’t add them up to bring back one very high-priced player.\u003c/p\u003e","text":"Exceptions can’t be combined with each other or with players to take on more salary, so while the Raptors could absorb a player into one of those exceptions, they can’t add them up to bring back one very high-priced player."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eThe Raptors can get a little creative in how they structure trades to take advantage of these exceptions, or to create more of them. For example, trading a $3-million player for a $7-million player violates the rules above, but trading a $3-million player in one deal and then acquiring a $7-million player with an exception is theoretically possible. There are other iterations that get more and more complicated. All of this is to say that while salary matching is difficult, there are some tools at a team’s disposal to make something happen.\u003c/p\u003e","text":"The Raptors can get a little creative in how they structure trades to take advantage of these exceptions, or to create more of them. For example, trading a $3-million player for a $7-million player violates the rules above, but trading a $3-million player in one deal and then acquiring a $7-million player with an exception is theoretically possible. There are other iterations that get more and more complicated. All of this is to say that while salary matching is difficult, there are some tools at a team’s disposal to make something happen."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eTeams can also involve an extra team to help facilitate trades, either by providing additional players and picks or taking on salary to help the numbers work. Those teams usually need to be compensated for helping out.\u003c/p\u003e","text":"Teams can also involve an extra team to help facilitate trades, either by providing additional players and picks or taking on salary to help the numbers work. Those teams usually need to be compensated for helping out."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eFeels like there’s a but coming…\u003c/p\u003e","text":"Feels like there’s a but coming…"},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eThe luxury tax line and the “luxury tax apron” both hang over the Raptors at the deadline. Exact contract figures for players aren’t confirmed by the team, but based on thr best publicly available estimates, the Raptors are very close to the luxury tax line. So if the Raptors add salary, it will come at a financial cost – for the first $5 million the Raptors go into the tax, they’d have to pay $1.50 in luxury tax payments, and $1.75 per-dollar for the next $5 million after that (and escalating from there). Teams that pay the tax also don’t receive tax payments from tax-paying teams at the end of the year.\u003c/p\u003e","text":"The luxury tax line and the “luxury tax apron” both hang over the Raptors at the deadline. Exact contract figures for players aren’t confirmed by the team, but based on thr best publicly available estimates, the Raptors are very close to the luxury tax line. So if the Raptors add salary, it will come at a financial cost – for the first $5 million the Raptors go into the tax, they’d have to pay $1.50 in luxury tax payments, and $1.75 per-dollar for the next $5 million after that (and escalating from there). Teams that pay the tax also don’t receive tax payments from tax-paying teams at the end of the year."},{"attributes":{"size":{"width":512,"height":512},"src":"https://cdn.nba.com/teams/legacy/i.cdn.turner.com/nba/nba/.element/media/2.0/teamsites/raptors/images/blake-miles756.jpg","alt":"CJ Miles","link":"","caption":"","id":"1002233","credit":"","align":"","caption_color":""},"type":"image","html":null,"text":null},{"attributes":[],"type":"paragraph","html":"\u003cp\u003e \u003c/p\u003e","text":" "},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eThe Raptors are also capped by what’s known as the luxury tax apron. In basic terms, the Raptors are “hard-capped” at $125.3 million for the year. That was triggered because the Raptors used the “non-taxpayer mid-level exception” to sign C.J. Miles this summer. Under no circumstances can they cross that salary total, even in the event of injury.\u003c/p\u003e","text":"The Raptors are also capped by what’s known as the luxury tax apron. In basic terms, the Raptors are “hard-capped” at $125.3 million for the year. That was triggered because the Raptors used the “non-taxpayer mid-level exception” to sign C.J. Miles this summer. Under no circumstances can they cross that salary total, even in the event of injury."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eWhat this means is that even with the exceptions available to them or within the salary matching rules and loopholes, the Raptors can’t go over that mark. Based on the best publicly available estimates, then, the Raptors can only add about $4.6 million in salary ahead of the deadline.\u003c/p\u003e","text":"What this means is that even with the exceptions available to them or within the salary matching rules and loopholes, the Raptors can’t go over that mark. Based on the best publicly available estimates, then, the Raptors can only add about $4.6 million in salary ahead of the deadline."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eAnything else to consider?\u003c/p\u003e","text":"Anything else to consider?"},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eThe Raptors have to have 14 players on the roster at all times, excluding two-way players. That means that if the Raptors send out two players for one, they’d have to sign someone to fill that 14th roster spot. The salary for that player will needed to be accounted for under the luxury tax apron, so simply piling up players to add more salary in a trade isn’t feasible.\u003c/p\u003e","text":"The Raptors have to have 14 players on the roster at all times, excluding two-way players. That means that if the Raptors send out two players for one, they’d have to sign someone to fill that 14th roster spot. The salary for that player will needed to be accounted for under the luxury tax apron, so simply piling up players to add more salary in a trade isn’t feasible."},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eHow else can the Raptors improve their roster?\u003c/p\u003e","text":"How else can the Raptors improve their roster?"},{"attributes":[],"type":"paragraph","html":"\u003cp\u003eThe trade deadline is only that: The deadline for trades. The Raptors can still add players after Thursday if they see fit. They have a 15th roster spot open, and as long as a player is waived by his former team by March 1, he’ll be playoff eligible. They can offer free agents the minimum salary or the remaining prorated amount of their bi-annual exception (which was originally $3.3 million). The Raptors still have to abide by the luxury tax apron and may have to pay tax on whatever salary they pay that player.\u003c/p\u003e","text":"The trade deadline is only that: The deadline for trades. The Raptors can still add players after Thursday if they see fit. They have a 15th roster spot open, and as long as a player is waived by his former team by March 1, he’ll be playoff eligible. They can offer free agents the minimum salary or the remaining prorated amount of their bi-annual exception (which was originally $3.3 million). The Raptors still have to abide by the luxury tax apron and may have to pay tax on whatever salary they pay that player."}],"related":[],"authors":[{"id":316,"slug":"toralaksmana","name":"toralaksmana","firstName":"alaksmana","lastName":"","organization":"","isNBAStaff":false,"authorPhoto":"","socialHandle":"","socialLink":"","wpseoTitle":"","wpseoMetadesc":"","description":"","userUrl":"","featuredAuthor":false}],"author":{"id":316,"slug":"toralaksmana","name":"toralaksmana","firstName":"alaksmana","lastName":"","organization":"","isNBAStaff":false,"authorPhoto":"","socialHandle":"","socialLink":"","wpseoTitle":"","wpseoMetadesc":"","description":"","userUrl":"","featuredAuthor":false}},"template":"article","team":{"id":1610612761,"slug":
